<html><head><title>Grandma's Banana Bread</title></head><body>
<div itemscope itemtype="http://schema.org/Recipe">
  <h1 itemprop="name">Grandma&#39;s Banana Bread</h1>
  <span itemprop="recipeCategory">Bread</span>
  <ul>
    <li itemprop="recipeIngredient"><span class="amt">3</span> ripe bananas</li>
    <li itemprop="recipeIngredient">1/3 cup melted butter</li>
    <li itemprop="ingredients">1 cup sugar</li>
  </ul>
  <ol itemprop="recipeInstructions">
    <li>Preheat oven to 350&deg;F.</li>
    <li>Mash the bananas &amp; mix in the butter.</li>
    <li>Stir in sugar, pour into a loaf pan and bake 1 hour.</li>
  </ol>
</div></body></html>
