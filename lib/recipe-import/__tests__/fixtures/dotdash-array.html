<script type="application/ld+json">[{"@context":"http://schema.org","@type":["Recipe"],"headline":"Chocolate Chip Cookies","name":"Best Chocolate Chip Cookies","recipeCategory":["Dessert","Cookies"],"recipeIngredient":["1 cup butter, softened","1 cup white sugar","2  large eggs","2 teaspoons vanilla extract","3 cups all-purpose flour","2 cups semisweet chocolate chips"],"recipeInstructions":[{"@type":"HowToStep","text":"Gather your ingredients, making sure your butter is softened, and your eggs are room temperature.\n"},{"@type":"HowToStep","text":"Preheat the oven to 350 degrees F (175 degrees C).\n"},{"@type":"HowToStep","text":"Beat butter and sugar with an electric mixer until smooth. Beat in eggs, one at a time, then stir in vanilla.\n"},{"@type":"HowToStep","text":"Stir in flour and chocolate chips. Drop spoonfuls onto ungreased pans.\n"},{"@type":"HowToStep","text":"Bake until edges are nicely browned, about 10 minutes.\n"}]}]</script>
